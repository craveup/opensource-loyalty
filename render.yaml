# Managed LIP shared clusters (PLA-798)
#
# Sandbox and production are intentionally separate services with separate
# disks, secrets, and independently managed Neon databases. Both database
# variables in one service point at that environment's direct (unpooled) Neon
# endpoint. Never reuse a Crave application database or a `-pooler` endpoint.
#
# `numInstances: 1` is a correctness constraint while Admin extension state
# and webhook dispatch retain single-process assumptions. The attached disks
# also prevent accidental scale-out. Promote and roll back deliberately.

previews:
  generation: off

services:
  - type: web
    name: lip-cloud-sandbox
    runtime: docker
    region: oregon
    plan: starter
    numInstances: 1
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerCommand: node apps/cloud/dist/cli.js
    preDeployCommand: node apps/cloud/dist/migrate-cli.js
    healthCheckPath: /health
    disk:
      name: lip-cloud-sandbox-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LIP_CLOUD_DEPLOYMENT_ENVIRONMENT
        value: sandbox
      - key: LIP_CLOUD_DATABASE_URL
        sync: false # direct sandbox Neon URL; never a Crave DB or pooler
      - key: LIP_CLOUD_DATA_PLANE_DATABASE_URL
        sync: false # same direct sandbox Neon URL
      - key: LIP_CLOUD_API_KEY
        sync: false # bootstrap only; retire after the first operator exists
      - key: LIP_CLOUD_CREDENTIAL_KEY
        sync: false # 32-byte unpadded base64url AES-256-GCM key
      - key: LIP_CLOUD_ALLOWED_ORIGINS
        sync: false
      - key: LIP_CLOUD_SHARED_KEY_DISABLED
        value: "false"
      - key: LIP_CLOUD_HOST
        value: 0.0.0.0
      - key: LIP_CLOUD_PORT
        value: "10000"
      - key: HEALTH_PORT
        value: "10000"
      - key: LIP_CLOUD_REGIONS
        value: render-oregon
      - key: LIP_CLOUD_DEFAULT_PLAN
        value: free
      - key: LIP_CLOUD_PROGRAM_DIR
        value: /data/programs
      - key: LIP_CLOUD_DATA_DIR
        value: /data/lip-cloud
      - key: LIP_CLOUD_BACKUP_DIR
        value: /data/lip-cloud/backups
      - key: LIP_CLOUD_ALLOW_LEGACY_CREDENTIAL_MIGRATION
        value: "false"
      - key: LIP_CLOUD_DATA_PLANE_HOST
        value: 0.0.0.0
      - key: LIP_CLOUD_DATA_PLANE_PUBLIC_HOST
        value: lip-cloud-sandbox
      - key: LIP_CLOUD_DATA_PLANE_BASE_PORT
        value: "13210"

  - type: web
    name: lip-cloud-production
    runtime: docker
    region: oregon
    plan: starter
    numInstances: 1
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerCommand: node apps/cloud/dist/cli.js
    preDeployCommand: node apps/cloud/dist/migrate-cli.js
    healthCheckPath: /health
    disk:
      name: lip-cloud-production-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: LIP_CLOUD_DEPLOYMENT_ENVIRONMENT
        value: production
      - key: LIP_CLOUD_DATABASE_URL
        sync: false # direct production Neon URL; never a Crave DB or pooler
      - key: LIP_CLOUD_DATA_PLANE_DATABASE_URL
        sync: false # same direct production Neon URL
      - key: LIP_CLOUD_API_KEY
        sync: false # bootstrap only; retire after the first operator exists
      - key: LIP_CLOUD_CREDENTIAL_KEY
        sync: false # independent production encryption key
      - key: LIP_CLOUD_ALLOWED_ORIGINS
        sync: false
      - key: LIP_CLOUD_SHARED_KEY_DISABLED
        value: "false"
      - key: LIP_CLOUD_HOST
        value: 0.0.0.0
      - key: LIP_CLOUD_PORT
        value: "10000"
      - key: HEALTH_PORT
        value: "10000"
      - key: LIP_CLOUD_REGIONS
        value: render-oregon
      - key: LIP_CLOUD_DEFAULT_PLAN
        value: free
      - key: LIP_CLOUD_PROGRAM_DIR
        value: /data/programs
      - key: LIP_CLOUD_DATA_DIR
        value: /data/lip-cloud
      - key: LIP_CLOUD_BACKUP_DIR
        value: /data/lip-cloud/backups
      - key: LIP_CLOUD_ALLOW_LEGACY_CREDENTIAL_MIGRATION
        value: "false"
      - key: LIP_CLOUD_DATA_PLANE_HOST
        value: 0.0.0.0
      - key: LIP_CLOUD_DATA_PLANE_PUBLIC_HOST
        value: lip-cloud-production
      - key: LIP_CLOUD_DATA_PLANE_BASE_PORT
        value: "13210"
