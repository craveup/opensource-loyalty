# Render Blueprint: shared LIP data plane (PLA-417)
#
# Deployable unit: the apps/cloud host (`node apps/cloud/dist/cli.js`).
# Why this entry point and not packages/server/src/cli.ts: the reference
# server binds exactly ONE tenant per process (LIP_TENANT_ID), so it cannot
# serve all brands from one service. The cloud host is the existing
# multi-tenant runner: its control plane provisions tenants (org -> project ->
# environment => generated tenant_id + program + merchant API key) and its
# LocalDataPlaneProvisioner boots one row-scoped Postgres runtime per tenant
# inside the same process, all sharing the one managed Postgres below.
#
# Single instance is a hard constraint, not a cost choice: docs/postgres.md
# requires at most ONE platform instance per tenant until PLA-428/429 land
# (Admin extension stores cache per-process revisions; webhook journals assume
# a single dispatcher). numInstances: 1 plus the attached disk (disk-backed
# services cannot scale out) both enforce it.
#
# Networking note: Render routes public HTTP only to the control-plane port.
# Per-tenant runtimes (ports 13210+) are reachable from other services in this
# Render account over the private network (host `lip-shared-data-plane`).
# The consuming BFF (Express API) already runs on Render, so it reaches
# tenants privately; public per-tenant hostnames are follow-up work.
#
# Secrets are sync: false — set them in the Render dashboard on first deploy.

previews:
  generation: off

databases:
  - name: lip-shared-postgres
    # Every PAID plan has point-in-time recovery; only Free has none. The tier
    # sets the recovery window (3 days here, 7 on Pro and above), not whether
    # PITR exists — an earlier comment here claimed basic-1gb was the cheapest
    # tier with PITR, which is not so. Sized for tenant #1; Postgres resizes up
    # without data loss, so buy the window and the RAM when tenants arrive.
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "17" # matches compose.yaml (postgres:17-alpine)
    databaseName: loyalty
    user: loyalty
    ipAllowList: [] # private-network access only; no public reads/writes

services:
  - type: web
    name: lip-shared-data-plane
    runtime: docker
    region: oregon # ONE regional cluster; a second region is a second blueprint
    # standard (2GB) is sized for N in-process tenant runtimes. Tenant #1 is
    # the only one, so start on starter (512MB, 0.5 CPU) and move up when a
    # second tenant lands or RSS approaches the cap — instance type changes
    # without data loss. Watch memory before onboarding tenant #2.
    plan: starter
    numInstances: 1 # REQUIRED: one platform instance per tenant (docs/postgres.md)
    autoDeploy: false # promote deliberately; loyalty state is financial data
    dockerfilePath: ./Dockerfile
    dockerCommand: node apps/cloud/dist/cli.js
    # Applies the engine schema (@loyalty-interchange/storage-postgres) and the
    # control-plane schema (apps/cloud/migrations) before each deploy goes
    # live. Advisory-locked and idempotent (apps/cloud/src/migrate-cli.ts).
    preDeployCommand: node apps/cloud/dist/migrate-cli.js
    healthCheckPath: /health # control-plane health (no auth required)
    disk:
      name: lip-cloud-data
      mountPath: /data
      # program JSONs, per-environment credentials, ports.json — kilobytes per
      # tenant. Render disks grow but never shrink, so start at the floor and
      # expand on demand rather than paying for 10GB of headroom from day one.
      sizeGB: 1
    envVars:
      # --- shared Postgres: control plane + every tenant's engine rows ---
      - key: LIP_CLOUD_DATABASE_URL
        fromDatabase:
          name: lip-shared-postgres
          property: connectionString
      - key: LIP_CLOUD_DATA_PLANE_DATABASE_URL
        fromDatabase:
          name: lip-shared-postgres
          property: connectionString
      # --- control-plane HTTP ---
      - key: LIP_CLOUD_HOST
        value: 0.0.0.0
      - key: LIP_CLOUD_PORT
        value: "10000" # Render's default detected port
      - key: HEALTH_PORT
        value: "10000"
      # Bootstrap-only shared key (>= 16 chars). PLA-442 retired it as a
      # general credential: it can create the FIRST operator and nothing else.
      # Onboarding and rotation calls made with it are rejected. The
      # X-LIP-Cloud-Subject header it used to pair with is gone — a caller can
      # no longer name itself.
      #
      # First deploy: set this, create the first operator with
      #   npm run cloud:operator -- create
      # then move every caller to its own lip_ok_… key and set
      # LIP_CLOUD_SHARED_KEY_DISABLED=true below. Never expose it to browsers
      # or mobile apps.
      - key: LIP_CLOUD_API_KEY
        sync: false
      # Flip to "true" once the first operator exists. Leaving it false past
      # bootstrap keeps a standing credential that can mint platform admins.
      - key: LIP_CLOUD_SHARED_KEY_DISABLED
        value: "false"
      # OIDC is the supported production auth path and removes the shared key
      # from the boot sequence entirely. Issuer and audience must be set
      # together or the process refuses to start. BOOTSTRAP_SUBJECTS lists the
      # identities allowed to create the first operator while none exists.
      - key: LIP_CLOUD_OIDC_ISSUER
        sync: false
      - key: LIP_CLOUD_OIDC_AUDIENCE
        sync: false
      - key: LIP_CLOUD_OIDC_JWKS_URI
        sync: false
      - key: LIP_CLOUD_BOOTSTRAP_SUBJECTS
        sync: false
      - key: LIP_CLOUD_ALLOWED_ORIGINS
        sync: false # e.g. https://dashboard.craveup.com
      - key: LIP_CLOUD_REGIONS
        value: render-oregon # must match --region passed to cloud:provision
      - key: LIP_CLOUD_DEFAULT_PLAN
        value: free
      # --- in-process data-plane provisioner (one runtime per tenant) ---
      - key: LIP_CLOUD_PROGRAM_DIR
        value: /data/programs # setting this enables the provisioning worker
      - key: LIP_CLOUD_DATA_DIR
        value: /data/lip-cloud # credentials files + ports.json (survive deploys)
      # Required 32-byte unpadded base64url key for AES-256-GCM credential and
      # local-backup encryption. Source it from an approved secret manager and
      # retain the old key until every restore drill has moved to the new one.
      - key: LIP_CLOUD_CREDENTIAL_KEY
        sync: false
      # Set true only for the first rollout that rewrites legacy plaintext v1/v2
      # credential files, verify the encrypted v3 files, then return it to false.
      - key: LIP_CLOUD_ALLOW_LEGACY_CREDENTIAL_MIGRATION
        value: "false"
      - key: LIP_CLOUD_BACKUP_DIR
        value: /data/lip-cloud/backups
      - key: LIP_CLOUD_DATA_PLANE_HOST
        value: 0.0.0.0 # tenant runtimes reachable over Render private network
      - key: LIP_CLOUD_DATA_PLANE_PUBLIC_HOST
        value: lip-shared-data-plane # private-network hostname written into api_url
      - key: LIP_CLOUD_DATA_PLANE_BASE_PORT
        value: "13210"
      # --- optional commercial billing adapter ---
      # Set the key and webhook secret together. Price ids are plan mappings,
      # not protocol configuration.
      - key: LIP_CLOUD_STRIPE_SECRET_KEY
        sync: false
      - key: LIP_CLOUD_STRIPE_WEBHOOK_SECRET
        sync: false
      - key: LIP_CLOUD_STRIPE_PRICE_PRO
        sync: false
      - key: LIP_CLOUD_STRIPE_PRICE_BUSINESS
        sync: false
      # --- optional externally authenticated customer BFF routes ---
      # Issuer, tenant, provider, and audience must be configured as one set.
      - key: LIP_CLOUD_CUSTOMER_OIDC_ISSUER
        sync: false
      - key: LIP_CLOUD_CUSTOMER_OIDC_AUDIENCE
        sync: false
      - key: LIP_CLOUD_CUSTOMER_TENANT_ID
        sync: false
      - key: LIP_CLOUD_CUSTOMER_PROVIDER_ID
        sync: false
